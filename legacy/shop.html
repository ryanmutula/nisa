<!DOCTYPE html>
<html lang="en" data-base="">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shop all fragrance — Nisa Perfumes</title>
<meta name="description" content="Eighty-seven fragrances from eleven houses — Amouage, Parfums de Marly, Nishane, Roja, Mancera, Casamorati, Goldfield & Banks, Initio, Montale, Afnan and Ajmal.">
<link rel="icon" href="assets/img/brand/favicon-32.png">
<link rel="stylesheet" href="assets/css/classical.css">
<link rel="stylesheet" href="assets/css/nisa.css">
<script>/* theme before first paint, so there is no flash */(function(){try{var t=localStorage.getItem('nisa:theme');document.documentElement.setAttribute('data-theme',t==='dark'?'dark':'light');document.documentElement.classList.add('no-anim');}catch(e){}})();</script>
</head>
<body data-page="shop">

<main>
  <div class="wrap crumb muted"><a href="index.html">Home</a> · Shop</div>

  <section class="wrap" style="padding-bottom:var(--space-8)">
    <div data-r style="max-width:34ch">
      <p class="kicker">The shelf</p>
      <h1 class="d2">Eleven houses, one room.</h1>
      <p class="muted" style="margin-top:var(--space-3)">Pick a house, a family, or just scroll. Every price shown includes duty and is stocked in Nairobi unless flagged otherwise.</p>
    </div>
  </section>

  <!-- family strip -->
  <div class="wrap"><div class="fams" id="fam-strip" data-r></div></div>

  <!-- house directory -->
  <section class="wrap band" style="padding-block:clamp(40px,6vw,80px)">
    <p class="kicker" data-r>The houses</p>
    <div class="houses" id="house-dir" data-r></div>
    <div id="house-note" hidden style="border:1px solid var(--rule);border-top:0;padding:var(--space-6) var(--space-4)"></div>
  </section>

  <section class="wrap" style="padding-bottom:clamp(64px,9vw,120px)">
    <div class="shop-lay">
      <aside class="filters" id="filters" aria-label="Filters"></aside>
      <div>
        <div class="shop-bar">
          <span class="muted small" id="count"></span>
          <div style="display:flex;gap:10px;align-items:center">
            <label class="small muted" for="sort">Sort</label>
            <select class="cur-sel" id="sort">
              <option value="feat">Featured</option>
              <option value="new">Newest in</option>
              <option value="low">Price · low to high</option>
              <option value="high">Price · high to low</option>
              <option value="az">A–Z</option>
            </select>
            <button class="b sm" id="clear"><span>Clear</span></button>
          </div>
        </div>
        <div class="shelf" id="shelf"></div>
        <div class="empty" id="none" hidden>
          <h3 class="d3">Nothing matches that combination.</h3>
          <p class="muted">Loosen one filter, or <a href="shop.html">start again</a>.</p>
        </div>
      </div>
    </div>
  </section>
</main>

<script src="assets/js/config.js"></script>
<script src="assets/js/catalog.js"></script>
<script src="assets/js/shop.js"></script>
<script src="assets/js/site.js"></script>
</body>
</html>
