<!DOCTYPE html>
<html lang="en" data-base="">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fragrance — Nisa Perfumes</title>
<meta name="description" content="Notes, sizes, pricing and availability, with a 360° view of the bottle.">
<link rel="icon" href="assets/img/brand/favicon-32.png">
<link rel="stylesheet" href="assets/css/classical.css">
<link rel="stylesheet" href="assets/css/nisa.css">
<script>/* theme before first paint, so there is no flash */(function(){try{var t=localStorage.getItem('nisa:theme');document.documentElement.setAttribute('data-theme',t==='dark'?'dark':'light');document.documentElement.classList.add('no-anim');}catch(e){}})();</script>
</head>
<body data-page="product">

<main>
  <div class="wrap crumb muted" id="crumb"><a href="index.html">Home</a> · <a href="shop.html">Shop</a></div>
  <section class="wrap" style="padding-bottom:clamp(48px,7vw,96px)">
    <div class="pdp" id="pdp"></div>
  </section>
  <section class="band wrap" id="related-wrap" hidden>
    <div style="display:flex;justify-content:space-between;align-items:end;flex-wrap:wrap;gap:var(--space-4)" data-r>
      <div><p class="kicker">Wear it next to</p><h2 class="d2" id="related-h">From the same family</h2></div>
      <a class="lnk" href="shop.html">All fragrance</a>
    </div>
    <div class="shelf" id="related" style="margin-top:var(--space-8)"></div>
  </section>
  <section class="band wrap" id="seen-wrap" hidden>
    <p class="kicker">Where you left off</p>
    <div class="seen" id="seen"></div>
  </section>
</main>

<script src="assets/js/config.js"></script>
<script src="assets/js/catalog.js"></script>
<script src="assets/js/product.js"></script>
